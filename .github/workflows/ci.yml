name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '22.22.3'

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Type check
      run: bun run check

    - name: Build
      run: bun run build

    - name: Test
      run: bun run test

    - name: Smoke test the built bundle
      # `--version` alone is not enough — it never reaches command dispatch,
      # so it stays green through failures in exactly the code that matters.
      # Running a real command with no credentials exercises dispatch, flag
      # parsing, and the error-formatting path, and must produce a structured
      # error rather than a crash or a raw stack trace. `events` now has a
      # real implementation (events-read), so the credential check itself —
      # not a NOT_IMPLEMENTED stub — is what fires here; TOKEN_INVALID is
      # what every credentialed command produces uniformly once implemented.
      run: |
        node dist/bin/calendly-axi.js --version
        node dist/bin/calendly-axi.js --help > /dev/null

        set +e
        out=$(node dist/bin/calendly-axi.js events 2>&1)
        code=$?
        set -e
        echo "$out"

        if [ "$code" -ne 1 ]; then
          echo "::error::expected exit 1 without credentials, got $code"
          exit 1
        fi
        if ! echo "$out" | grep -q 'code: TOKEN_INVALID'; then
          echo "::error::expected a structured TOKEN_INVALID error"
          exit 1
        fi

        # A leaked stack trace means an unhandled failure reached stdout, where
        # an agent would try to read it as data.
        if echo "$out" | grep -qE '^\s+at |node:internal'; then
          echo "::error::a raw stack trace leaked to stdout"
          exit 1
        fi

        echo "smoke test passed"
